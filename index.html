/* Layout: markalı hero + "nasıl çalışır" şeridi + saha sürümü bölümleri halinde oyun kataloğu */
:root{

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#201915; --card:#2b221c; --fg:#f1e9e2; --muted:#a4968b; --line:#3f332b;
    --copper:#c98f6f; --copper-d:#b57b5e; --copper-l:#8f5c43;

  }
}
:root[data-theme="dark"]{
  --bg:#201915; --card:#2b221c; --fg:#f1e9e2; --muted:#a4968b; --line:#3f332b;
  --copper:#c98f6f; --copper-d:#b57b5e; --copper-l:#8f5c43;
  --wood:#c99a55; --gold:#d9b14a; --chip:#362b23; --ink:#f1e9e2; color-scheme:dark;
}
body{
  background:var(--bg); color:var(--fg);
  font-family:'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 40px;
  font-size:16px; line-height:1.5;
}
.wrap{max-width:1080px;margin:0 auto}
.hazard{height:10px;background:repeating-linear-gradient(135deg,var(--copper) 0 16px,#241d19 16px 32px);border-radius:0 0 8px 8px;margin:0 -4px}
header.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:20px 0 8px}
.logobox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;align-items:center}
.logobox svg{height:36px;width:auto;display:block}
.langs{margin-left:auto;display:flex;gap:6px}
.langbtn{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;cursor:pointer}
.langbtn.on{background:var(--copper);border-color:var(--copper-d);color:#fff}
.hero{padding:26px 0 10px}
.hero h1{margin:0;font-size:clamp(30px,5vw,52px);letter-spacing:-.5px;line-height:1.08;text-wrap:balance}
.hero h1 .a{color:var(--copper)}
.hero .tag{color:var(--muted);font-size:clamp(15px,2vw,18px);margin-top:10px;max-width:640px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px}
.stat b{display:block;font-size:22px;color:var(--copper-d);font-variant-numeric:tabular-nums}
:root[data-theme="dark"] .stat b{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stat b{color:var(--copper)}}
section{margin-top:34px}
h2{margin:0 0 4px;font-size:24px}
.secsub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.step{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--copper);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.step b{display:block;margin-bottom:4px}
.step p{margin:0;color:var(--muted);font-size:13.5px}
.suite{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:20px;margin-top:16px}
.suitehead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.suitehead h3{margin:0;font-size:19px}
.suitehead .sb{background:var(--chip);color:var(--copper-d);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;letter-spacing:.5px}
:root[data-theme="dark"] .suitehead .sb{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .suitehead .sb{color:var(--copper)}}
.suitesub{color:var(--muted);font-size:13.5px;margin:0 0 14px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.g{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:7px;min-width:0;background:var(--bg)}
.g .ic{font-size:26px}
.g b{font-size:15.5px}
.g .d{color:var(--muted);font-size:13px;flex:1}
.g .tags{display:flex;gap:6px;flex-wrap:wrap}
.g .t{background:var(--chip);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.g a{display:inline-block;margin-top:2px;color:#fff;background:linear-gradient(135deg,var(--copper),var(--copper-d));border-radius:10px;padding:8px 14px;font-weight:700;font-size:13.5px;text-decoration:none;text-align:center}
.g a.ghost{background:var(--card);color:var(--copper-d);border:1px solid var(--copper-l)}
:root[data-theme="dark"] .g a.ghost{color:var(--copper)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .g a.ghost{color:var(--copper)}}
.g.panelcard{border-style:dashed;border-color:var(--copper-l)}
.note{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px;color:var(--muted);margin-top:14px}
footer{margin-top:44px;text-align:center;color:var(--muted);font-size:13px;line-height:1.7}
footer .bar{height:6px;border-radius:4px;background:repeating-linear-gradient(135deg,var(--copper-l) 0 12px,var(--ink) 12px 24px);opacity:.7;margin-bottom:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

  badge:{gen:'GENERAL', maden:'MINING', mdf:'PANELBOARD', lig:'LEAGUE', soon:'UPCOMING', panels:'LIVE'},
  shareNote:'ℹ️ Trainer note: every game on this site is public and opens directly from its QR code. Live panels (score keeping) run on claude.ai. A printable QR poster exists for every game.'
 }
};

var lang='tr';
try{ var s=localStorage.getItem('sdg-lang'); if(s==='en'||s==='tr') lang=s; }catch(e){}

function esc(x){ return String(x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function render(){
  var t=L[lang];
  document.getElementById('btnTR').className='langbtn'+(lang==='tr'?' on':'');
  document.getElementById('btnEN').className='langbtn'+(lang==='en'?' on':'');
  document.getElementById('tagline').textContent=t.tagline;
  document.getElementById('stats').innerHTML=t.stats.map(function(s){return '<div class="stat"><b>'+esc(s[0])+'</b>'+esc(s[1])+'</div>';}).join('');
  document.getElementById('howH').textContent=t.howH;
  document.getElementById('howS').textContent=t.howS;
  document.getElementById('howGrid').innerHTML=t.how.map(function(s,i){return '<div class="step"><div class="n">'+(i+1)+'</div><b>'+esc(s[0])+'</b><p>'+esc(s[1])+'</p></div>';}).join('');
  document.getElementById('catH').textContent=t.catH;
  document.getElementById('catS').textContent=t.catS;
  document.getElementById('suites').innerHTML=t.suites.map(function(su){
    var key=su[0];
    var cards=GAMES[key].map(function(g){
      var gg=g[lang];
      return '<div class="g'+(key==='panels'?' panelcard':'')+'"><div class="ic">'+g.ic+'</div><b>'+esc(gg.n)+'</b>'+
        '<span class="d">'+esc(gg.d)+'</span>'+
        '<div class="tags">'+gg.tags.map(function(x){return '<span class="t">'+esc(x)+'</span>';}).join('')+'</div>'+
        (g.u? '<a href="'+g.u+'" target="_blank" rel="noopener"'+(key==='panels'?' class="ghost"':'')+'>'+(key==='panels'?t.open:t.play)+'</a>' : '<a class="ghost" style="pointer-events:none;opacity:.75">'+t.soon+'</a>')+'</div>';
    }).join('');
    return '<div class="suite"><div class="suitehead"><h3>'+esc(su[1])+'</h3><span class="sb">'+esc(t.badge[key])+'</span></div>'+
      '<p class="suitesub">'+esc(su[2])+'</p><div class="games">'+cards+'</div></div>';
  }).join('');
  document.getElementById('shareNote').textContent=t.shareNote;
}
function setLang(l){ lang=l; try{ localStorage.setItem('sdg-lang',l); }catch(e){} render(); }
render();
</script>

</html>
